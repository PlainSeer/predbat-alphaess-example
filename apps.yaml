# -----------------------------------------------------------------------------
# PredBat + AlphaESS Modbus EXAMPLE ONLY
# -----------------------------------------------------------------------------
# This file is deliberately NOT drop-in ready.
#
# Anything containing REPLACE_ME / YOUR_ must be changed for your installation.
# Numerical values are examples/placeholders and MUST be checked against your
# battery, inverter, DNO/export limit and AlphaESS integration before use.
#
# Test in Monitor/Read-only mode first. Modbus writes can directly affect the
# inverter and battery. Use entirely at your own risk.
# -----------------------------------------------------------------------------

pred_bat:
  module: predbat
  class: PredBat

  # ---------------------------------------------------------------------------
  # General
  # ---------------------------------------------------------------------------
  prefix: predbat
  timezone: YOUR_TIMEZONE                 # e.g. Europe/London

  currency_symbols:
    - "YOUR_CURRENCY_MAJOR"               # e.g. £
    - "YOUR_CURRENCY_MINOR"               # e.g. p

  threads: auto
  forecast_hours: 48

  days_previous:
    - 28

  # ---------------------------------------------------------------------------
  # Load ML prediction - optional
  # ---------------------------------------------------------------------------
  load_ml_enable: true
  load_ml_source: true
  load_ml_max_days_history: 28
  load_ml_database_days: 90
  temperature_enable: true

  # ---------------------------------------------------------------------------
  # AlphaESS custom inverter - Modbus control
  # ---------------------------------------------------------------------------
  num_inverters: 1
  inverter_type: "ALPHAESS_MODBUS"

  inverter:
    name: "AlphaESS Modbus"

    has_rest_api: false
    has_mqtt_api: false
    has_service_api: true

    output_charge_control: "none"
    charge_control_immediate: false
    current_dp: 1
    charge_discharge_with_rate: false
    has_charge_enable_time: false
    has_discharge_enable_time: false
    has_target_soc: false
    target_soc_used_for_discharge: false
    has_reserve_soc: false
    has_timed_pause: false
    time_button_press: false

    # Charge freeze is implemented using the AlphaESS Modbus force-charge
    # controls. This is an emulation, not a native AlphaESS/PredBat freeze mode.
    support_charge_freeze: true

    # Leave disabled unless YOU have tested a safe discharge-freeze method on
    # your own inverter/firmware. The reference setup intentionally leaves it off.
    support_discharge_freeze: false

    has_ge_inverter_mode: false
    has_fox_inverter_mode: false
    has_idle_time: false
    has_time_window: false

    charge_time_format: "S"
    charge_time_entity_is_option: false
    can_span_midnight: true
    clock_time_format: "%Y-%m-%d %H:%M:%S"
    num_load_entities: 1
    soc_units: "%"
    write_and_poll_sleep: 2

  # ---------------------------------------------------------------------------
  # AlphaESS Modbus control services
  # ---------------------------------------------------------------------------
  # IMPORTANT:
  # The entity IDs below are placeholders. Select the matching entities created
  # by YOUR AlphaESS Modbus integration instance.
  #
  # The reference setup uses a +10 percentage-point margin for the CHARGE target
  # and an independent Home Assistant watchdog. See README.md and
  # home_assistant_target_soc_watchdog.example.yaml before enabling writes.

  charge_start_service:
    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_export

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_discharging

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_import

    # Reference behaviour: request PredBat target + 10 percentage points.
    # Cap/validation should be enforced by your HA-side helper/watchdog.
    # If your PredBat/AppDaemon version does not evaluate this expression in
    # service data, implement the offset in Home Assistant instead.
    - service: number.set_value
      entity_id: number.REPLACE_ME_alphaess_force_charging_stop_at_soc
      value: "{{ [target_soc + 10, 100] | min }}"

    - service: number.set_value
      entity_id: number.REPLACE_ME_alphaess_force_charging_duration
      value: YOUR_SAFE_CHARGE_DURATION_MINUTES

    - service: number.set_value
      entity_id: number.REPLACE_ME_alphaess_force_charging_power
      value: YOUR_SAFE_CHARGE_POWER_KW

    - service: switch.turn_on
      entity_id: switch.REPLACE_ME_alphaess_force_charging_hold

    - service: switch.turn_on
      entity_id: switch.REPLACE_ME_alphaess_force_charging

  # ---------------------------------------------------------------------------
  # Charge freeze
  # ---------------------------------------------------------------------------
  # The AlphaESS integration does not expose a native PredBat-style freeze.
  # The reference method emulates it using force charging + hold. PredBat can
  # therefore hold the battery rather than allowing normal self-consumption to
  # move SoC. Test this carefully on your firmware before relying on it.
  charge_freeze_service:
    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_export

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_discharging

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_import

    - service: switch.turn_on
      entity_id: switch.REPLACE_ME_alphaess_force_charging_hold

    - service: switch.turn_on
      entity_id: switch.REPLACE_ME_alphaess_force_charging

  # "Unfreeze" / return to normal is achieved by stopping force charge and hold.
  charge_stop_service:
    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_charging

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_charging_hold

  # ---------------------------------------------------------------------------
  # Discharge / export
  # ---------------------------------------------------------------------------
  discharge_start_service:
    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_charging

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_charging_hold

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_discharging

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_import

    - service: number.set_value
      entity_id: number.REPLACE_ME_alphaess_force_export_stop_at_soc
      value: "{target_soc}"

    - service: number.set_value
      entity_id: number.REPLACE_ME_alphaess_force_export_duration
      value: YOUR_SAFE_EXPORT_DURATION_MINUTES

    - service: number.set_value
      entity_id: number.REPLACE_ME_alphaess_force_export_power
      value: YOUR_SAFE_EXPORT_POWER_KW

    - service: switch.turn_on
      entity_id: switch.REPLACE_ME_alphaess_force_export

  discharge_stop_service:
    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_export

    - service: switch.turn_off
      entity_id: switch.REPLACE_ME_alphaess_force_discharging

  # ---------------------------------------------------------------------------
  # Battery state
  # ---------------------------------------------------------------------------
  soc_percent:
    - sensor.REPLACE_ME_alphaess_battery_state_of_charge

  soc_max:
    - YOUR_BATTERY_USABLE_CAPACITY_KWH

  # ---------------------------------------------------------------------------
  # Live power
  # ---------------------------------------------------------------------------
  battery_power:
    - sensor.REPLACE_ME_alphaess_battery_power
  battery_power_invert: false

  pv_power:
    - sensor.REPLACE_ME_alphaess_current_pv_production

  load_power:
    - sensor.REPLACE_ME_alphaess_current_house_load
  load_power_invert: false

  grid_power:
    - sensor.REPLACE_ME_alphaess_grid_power

  # Confirm the sign convention in Developer Tools before copying this value.
  grid_power_invert: YOUR_GRID_POWER_INVERT_SETTING

  # ---------------------------------------------------------------------------
  # Daily energy
  # ---------------------------------------------------------------------------
  # load_today must be a monotonically increasing kWh sensor for today's HOUSE
  # consumption. Do not blindly use an AlphaESS cloud/API entity from another
  # installation. See README.md.
  load_today:
    - sensor.REPLACE_ME_house_load_today_kwh

  import_today:
    - sensor.REPLACE_ME_grid_import_today_kwh

  export_today:
    - sensor.REPLACE_ME_grid_export_today_kwh

  pv_today:
    - sensor.REPLACE_ME_pv_generation_today_kwh

  # ---------------------------------------------------------------------------
  # Battery / inverter characteristics
  # ---------------------------------------------------------------------------
  # These values are intentionally not copied from the author's installation.
  # Check your battery data sheet, inverter rating, BMS limits and grid/export
  # permission. Do not guess.
  battery_rate_max:
    - YOUR_BATTERY_RATE_MAX_W

  inverter_limit:
    - YOUR_INVERTER_LIMIT_W

  inverter_limit_charge:
    - YOUR_INVERTER_CHARGE_LIMIT_W

  inverter_limit_discharge:
    - YOUR_INVERTER_DISCHARGE_LIMIT_W

  inverter_limit_export:
    - YOUR_SITE_EXPORT_LIMIT_W

  battery_min_soc:
    - YOUR_MINIMUM_SOC_PERCENT

  battery_scaling:
    - 1.0

  balance_inverters_seconds: 0

  # ---------------------------------------------------------------------------
  # Clock skew
  # ---------------------------------------------------------------------------
  inverter_clock_skew_start: 0
  inverter_clock_skew_end: 0
  inverter_clock_skew_discharge_start: 0
  inverter_clock_skew_discharge_end: 0
  clock_skew: 0

  # ---------------------------------------------------------------------------
  # PV forecast - OPTIONAL, replace with your own provider/entities
  # ---------------------------------------------------------------------------
  pv_forecast_today: sensor.REPLACE_ME_pv_forecast_today
  pv_forecast_tomorrow: sensor.REPLACE_ME_pv_forecast_tomorrow
  pv_forecast_d3: sensor.REPLACE_ME_pv_forecast_day_3
  pv_forecast_d4: sensor.REPLACE_ME_pv_forecast_day_4

  # ---------------------------------------------------------------------------
  # EV charger awareness - OPTIONAL
  # ---------------------------------------------------------------------------
  num_cars: YOUR_NUMBER_OF_CARS

  car_charging_now:
    - binary_sensor.REPLACE_ME_ev_actively_charging

  car_charging_now_response:
    - "on"

  car_charging_energy:
    - sensor.REPLACE_ME_ev_energy_today_kwh

  # ---------------------------------------------------------------------------
  # Intelligent tariff awareness - OPTIONAL
  # ---------------------------------------------------------------------------
  # These are placeholders by design. Never publish account-/meter-/device-
  # specific Octopus entity IDs from a private Home Assistant installation.
  octopus_intelligent_slot:
    binary_sensor.REPLACE_ME_intelligent_dispatch_active

  octopus_ready_time:
    select.REPLACE_ME_ev_ready_time

  octopus_charge_limit:
    number.REPLACE_ME_ev_charge_target

  octopus_slot_low_rate: true
  combine_charge: true
  calculate_export_during_charge: false

  # ---------------------------------------------------------------------------
  # PredBat watch list
  # ---------------------------------------------------------------------------
  watch_list:
    - "{octopus_intelligent_slot}"
    - "{octopus_ready_time}"
    - "{octopus_charge_limit}"
    - "+[car_charging_now]"

  # ---------------------------------------------------------------------------
  # Import/export tariff rates - OPTIONAL
  # ---------------------------------------------------------------------------
  metric_octopus_import:
    sensor.REPLACE_ME_import_rate

  metric_octopus_export:
    sensor.REPLACE_ME_export_rate

  metric_standing_charge:
    sensor.REPLACE_ME_standing_charge

  # ---------------------------------------------------------------------------
  # Optional rate overrides
  # ---------------------------------------------------------------------------
  # Do NOT copy another household's tariff windows. Add your own only if needed.
  # Example syntax:
  # rates_export_override:
  #   - start: "HH:MM:SS"
  #     end: "HH:MM:SS"
  #     rate: YOUR_RATE

  import_export_scaling: 1.0
