# Home Assistant examples used by apps.yaml.
# Review entity names, ranges and inverter limits before use.

# Add to configuration.yaml if YAML helpers are used. UI-created helpers with
# the same entity IDs are equally valid.
input_number:
  predbat_alphaess_charge_rate_w:
    name: PredBat AlphaESS charge rate
    min: 0
    max: 8000
    step: 100
    unit_of_measurement: W
    mode: box

  predbat_alphaess_export_rate_w:
    name: PredBat AlphaESS export rate
    min: 0
    max: 8000
    step: 100
    unit_of_measurement: W
    mode: box

# Add this keyed definition to scripts.yaml, or create the equivalent UI script.
predbat_alphaess_export_stop_soc:
  alias: PredBat AlphaESS Export Stop SOC
  description: >-
    Sets the AlphaESS force-export stop SOC to the last percentage shown in
    PredBat's current Exporting status detail. Handles both two-percentage forms
    such as 82%-56% and single-target forms such as target 56%. Falls back to
    PredBat's passed target_soc when no live Exporting target can be parsed.
  mode: restart
  fields:
    target_soc:
      name: PredBat target SOC
      description: Fallback SOC supplied by PredBat.
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
  sequence:
    - action: number.set_value
      target:
        entity_id: number.alphaess_inverter_force_export_stop_at_soc
      data:
        value: >-
          {% set d = state_attr('predbat.status', 'detail') | default('', true) %}
          {% set vals = d | regex_findall('([0-9]+(?:\\.[0-9]+)?)%') %}
          {% if is_state('predbat.status', 'Exporting') and vals %}
            {{ vals | last | float }}
          {% else %}
            {{ target_soc | float(0) }}
          {% endif %}

# Add these list entries to automations.yaml, or create equivalent UI automations.
- id: predbat_alphaess_charge_rate_bridge
  alias: PredBat AlphaESS Charge Rate Bridge
  description: >-
    Convert PredBat's requested charge rate in watts to the AlphaESS Force
    Charging Power control in kW.
  triggers:
    - trigger: state
      entity_id: input_number.predbat_alphaess_charge_rate_w
    - trigger: state
      entity_id: switch.alphaess_inverter_force_charging
      to: "on"
  conditions: []
  actions:
    - action: number.set_value
      target:
        entity_id: number.alphaess_inverter_force_charging_power
      data:
        value: >-
          {{ (states('input_number.predbat_alphaess_charge_rate_w')
              | float(0) / 1000) | round(1) }}
  mode: restart

- id: predbat_alphaess_export_rate_bridge
  alias: PredBat AlphaESS Export Rate Bridge
  description: >-
    Convert PredBat's requested discharge/export rate in watts to the AlphaESS
    Force Export Power control in kW.
  triggers:
    - trigger: state
      entity_id: input_number.predbat_alphaess_export_rate_w
    - trigger: state
      entity_id: switch.alphaess_inverter_force_export
      to: "on"
  conditions: []
  actions:
    - action: number.set_value
      target:
        entity_id: number.alphaess_inverter_force_export_power
      data:
        value: >-
          {{ (states('input_number.predbat_alphaess_export_rate_w')
              | float(0) / 1000) | round(1) }}
  mode: restart

- id: predbat_alphaess_export_soc_sync
  alias: PredBat AlphaESS Export SOC Sync
  description: >-
    While PredBat is actively Exporting, update AlphaESS's export-stop SoC
    after replans only when predbat.status contains a parseable percentage.
    Once the Modbus write has settled, recover Force Export only when its
    physical switch is off and battery SoC is more than one percentage point
    above the configured stop target. Preserve the existing target and do not
    restart export if PredBat's detail format cannot be parsed.
  triggers:
    - trigger: state
      entity_id: predbat.status
  conditions:
    - condition: state
      entity_id: predbat.status
      state: Exporting
    - condition: template
      value_template: >-
        {{ (state_attr('predbat.status', 'detail') | default('', true)
             | regex_findall('([0-9]+(?:\\.[0-9]+)?)%') | count) > 0 }}
  actions:
    - action: script.turn_on
      target:
        entity_id: script.predbat_alphaess_export_stop_soc
      data:
        variables:
          target_soc: >-
            {{ states('number.alphaess_inverter_force_export_stop_at_soc')
               | float(0) }}

    - delay: "00:00:01"

    - if:
        - condition: state
          entity_id: predbat.status
          state: Exporting
        - condition: state
          entity_id: switch.alphaess_inverter_force_export
          state: "off"
        - condition: template
          value_template: >-
            {{ states('sensor.alphaess_inverter_battery_state_of_charge')
                 not in ['unknown', 'unavailable']
               and states('number.alphaess_inverter_force_export_stop_at_soc')
                 not in ['unknown', 'unavailable']
               and states('sensor.alphaess_inverter_battery_state_of_charge')
                 | float
                 > (states('number.alphaess_inverter_force_export_stop_at_soc')
                    | float + 1) }}
      then:
        - action: switch.turn_on
          target:
            entity_id: switch.alphaess_inverter_force_export
  mode: restart
