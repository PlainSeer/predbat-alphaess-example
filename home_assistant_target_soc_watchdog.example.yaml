# -----------------------------------------------------------------------------
# Home Assistant example: AlphaESS charge-target +10 percentage-point watchdog
# -----------------------------------------------------------------------------
# EXAMPLE ONLY - NOT DROP-IN READY.
#
# This is deliberately independent of PredBat/AppDaemon. Its purpose is to
# re-assert a safety/behaviour margin if the AlphaESS force-charge stop-at-SoC
# number is changed while a managed force-charge is active.
#
# Replace EVERY entity containing REPLACE_ME before use.
# Test manually and in PredBat Monitor/Read-only mode first.
# -----------------------------------------------------------------------------

# Suggested helper (create through Settings -> Devices & services -> Helpers,
# or define in YAML if you manage helpers that way):
#
# input_number:
#   REPLACE_ME_predbat_requested_charge_soc:
#     name: PredBat requested charge SoC
#     min: 0
#     max: 100
#     step: 1
#     unit_of_measurement: "%"
#
# The helper should contain PredBat's RAW requested target, before the +10
# percentage-point margin is applied. How you populate it depends on your
# PredBat configuration/version. Do not guess an entity ID from this example.

- id: REPLACE_ME_alphaess_predbat_charge_soc_margin_watchdog
  alias: "EXAMPLE - AlphaESS PredBat charge SoC +10 watchdog"
  description: >-
    Re-applies the configured +10 percentage-point charge target margin while
    PredBat-managed AlphaESS force charging is active. Example only; replace all
    entities and validate behaviour on your own inverter before enabling.

  mode: restart

  trigger:
    # Re-check whenever the inverter target is changed.
    - platform: state
      entity_id: number.REPLACE_ME_alphaess_force_charging_stop_at_soc

    # Re-check when managed force charging starts.
    - platform: state
      entity_id: switch.REPLACE_ME_alphaess_force_charging
      to: "on"

    # Re-check if PredBat's raw requested target changes.
    - platform: state
      entity_id: input_number.REPLACE_ME_predbat_requested_charge_soc

    # Periodic safety re-check. Adjust/remove only after understanding why it is
    # present; do not use an unnecessarily aggressive interval.
    - platform: time_pattern
      minutes: "/5"

  condition:
    # Only interfere while the force-charge dispatch is active.
    - condition: state
      entity_id: switch.REPLACE_ME_alphaess_force_charging
      state: "on"

    # Optional second guard: require the hold switch too, if this is how your
    # PredBat-managed charge is identified.
    - condition: state
      entity_id: switch.REPLACE_ME_alphaess_force_charging_hold
      state: "on"

  action:
    - variables:
        requested_soc: >-
          {{ states('input_number.REPLACE_ME_predbat_requested_charge_soc') | float(0) }}
        protected_soc: >-
          {{ [requested_soc + 10, 100] | min }}
        inverter_soc: >-
          {{ states('number.REPLACE_ME_alphaess_force_charging_stop_at_soc') | float(-1) }}

    # Do nothing if the source target is invalid/uninitialised.
    - condition: template
      value_template: >-
        {{ requested_soc > 0 and requested_soc <= 100 }}

    # Only write when the current value differs. This prevents unnecessary
    # Modbus writes and avoids an automation feedback loop.
    - condition: template
      value_template: >-
        {{ (inverter_soc - protected_soc) | abs > 0.1 }}

    - service: number.set_value
      target:
        entity_id: number.REPLACE_ME_alphaess_force_charging_stop_at_soc
      data:
        value: "{{ protected_soc }}"

# -----------------------------------------------------------------------------
# IMPORTANT BEHAVIOUR NOTES
# -----------------------------------------------------------------------------
# 1. '+10%' here means +10 PERCENTAGE POINTS, not multiplying the target by 1.10.
#    Example: a raw PredBat target of 80% becomes 90%, not 88%.
#
# 2. The result is capped at 100%.
#
# 3. This watchdog is intentionally outside PredBat. If PredBat restarts or a
#    later service call changes the AlphaESS number, HA can re-check the target.
#
# 4. The watchdog must NOT run continuously against manual charging unless that
#    is specifically what you want. The force-charge/hold conditions above are
#    intended to scope it to the managed dispatch.
#
# 5. This example applies the margin to CHARGING only. Do not copy the +10 rule
#    to discharge/export stop-at-SoC without independently validating the
#    meaning and behaviour of that register on your inverter/firmware.
#
# 6. A watchdog is not a substitute for the inverter/BMS hardware minimum and
#    maximum protections. Keep all native AlphaESS/BMS safety limits intact.
