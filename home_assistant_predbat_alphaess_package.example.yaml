# Optional Home Assistant package for the reusable PredBat + AlphaESS bridge.
#
# Review every entity name and power limit before use. This file is an
# alternative to creating the same helpers, sensors, script and automations
# through the UI or separate YAML files. Do not load duplicate definitions.
#
# PredBat's apps.yaml remains separate and is not part of this package.

input_number:
  predbat_alphaess_charge_rate_w:
    name: PredBat AlphaESS charge rate
    min: 0
    max: 8000
    step: 100
    unit_of_measurement: W
    mode: box

  predbat_alphaess_export_rate_w:
    name: PredBat AlphaESS export rate
    min: 0
    max: 8000
    step: 100
    unit_of_measurement: W
    mode: box

sensor:
  - platform: integration
    source: sensor.alphaess_inverter_current_house_load
    name: AlphaESS Inverter PredBat Experimental Modbus House Load Energy
    unique_id: alphaess_inverter_predbat_experimental_modbus_house_load_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 4

utility_meter:
  alphaess_inverter_predbat_experimental_modbus_house_load_today:
    name: AlphaESS Inverter PredBat Experimental Modbus House Load Today
    unique_id: alphaess_inverter_predbat_experimental_modbus_house_load_today
    source: sensor.alphaess_inverter_predbat_experimental_modbus_house_load_energy
    cycle: daily
    periodically_resetting: true
    always_available: true

script:
  predbat_alphaess_export_stop_soc:
    alias: PredBat AlphaESS Discharge Stop SOC
    description: >-
      Sets the AlphaESS Force Discharging stop SOC to the final percentage
      shown in PredBat's current Exporting status detail. Falls back to
      PredBat's passed target_soc when no live Exporting endpoint can be parsed.
    mode: restart
    fields:
      target_soc:
        name: PredBat target SOC
        description: Fallback SOC supplied by PredBat.
        selector:
          number:
            min: 0
            max: 100
            step: 1
            unit_of_measurement: "%"
    sequence:
      - action: number.set_value
        target:
          entity_id: number.alphaess_inverter_force_discharging_stop_at_soc
        data:
          value: >-
            {% set d = state_attr('predbat.status', 'detail') | default('', true) %}
            {% set vals = d | regex_findall('([0-9]+(?:\\.[0-9]+)?)%') %}
            {% if is_state('predbat.status', 'Exporting') and vals %}
              {{ vals | last | float }}
            {% else %}
              {{ target_soc | float(0) }}
            {% endif %}

automation:
  - id: predbat_alphaess_charge_rate_bridge
    alias: PredBat AlphaESS Charge Rate Bridge
    description: >-
      Convert PredBat's requested charge rate in watts to the AlphaESS Force
      Charging Power control in kW.
    triggers:
      - trigger: state
        entity_id: input_number.predbat_alphaess_charge_rate_w
      - trigger: state
        entity_id: switch.alphaess_inverter_force_charging
        to: "on"
    conditions: []
    actions:
      - action: number.set_value
        target:
          entity_id: number.alphaess_inverter_force_charging_power
        data:
          value: >-
            {{ (states('input_number.predbat_alphaess_charge_rate_w')
                | float(0) / 1000) | round(1) }}
    mode: restart

  - id: predbat_alphaess_export_rate_bridge
    alias: PredBat AlphaESS Discharge Rate Bridge
    description: >-
      Modulate only an already-active PredBat Force Discharging session. While
      PredBat is Exporting and Force Discharging is on, set the AlphaESS
      discharge power to max(PredBat requested discharge W, house load W - PV W,
      0), capped at 8000 W and rounded to 0.1 kW; skip changes below 0.2 kW.
      Otherwise clear nonzero discharge power. Never start, stop or re-enable
      Force Discharging; PredBat retains switch, duration and stop-SOC ownership.
    triggers:
      - trigger: state
        entity_id:
          - input_number.predbat_alphaess_export_rate_w
          - predbat.status
          - switch.alphaess_inverter_force_discharging
          - sensor.alphaess_inverter_current_house_load
          - sensor.alphaess_inverter_current_pv_production
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: predbat.status
                state: Exporting
              - condition: state
                entity_id: switch.alphaess_inverter_force_discharging
                state: "on"
            sequence:
              - variables:
                  target_kw: >-
                    {{ (([8000, ([0,
                        states('input_number.predbat_alphaess_export_rate_w') | float(0),
                        (states('sensor.alphaess_inverter_current_house_load') | float(0))
                        - (states('sensor.alphaess_inverter_current_pv_production') | float(0))]
                        | max)] | min) / 1000) | round(1) }}
              - condition: template
                value_template: >-
                  {{ (((target_kw | float(0))
                      - (states('number.alphaess_inverter_force_discharging_power') | float(0)))
                      | abs | round(3)) >= 0.2 }}
              - condition: state
                entity_id: predbat.status
                state: Exporting
              - condition: state
                entity_id: switch.alphaess_inverter_force_discharging
                state: "on"
              - action: number.set_value
                target:
                  entity_id: number.alphaess_inverter_force_discharging_power
                data:
                  value: >-
                    {{ target_kw
                       if is_state('predbat.status', 'Exporting')
                       and is_state('switch.alphaess_inverter_force_discharging', 'on')
                       else 0 }}
        default:
          - condition: numeric_state
            entity_id: number.alphaess_inverter_force_discharging_power
            above: 0
          - action: number.set_value
            target:
              entity_id: number.alphaess_inverter_force_discharging_power
            data:
              value: 0
    mode: restart

  - id: predbat_alphaess_export_soc_sync
    alias: PredBat AlphaESS Discharge SOC Sync
    description: >-
      While PredBat is Exporting, keep the AlphaESS Force Discharging stop SOC
      aligned with the final percentage in predbat.status. Does not start or
      restart a forced mode.
    triggers:
      - trigger: state
        entity_id: predbat.status
    conditions:
      - condition: state
        entity_id: predbat.status
        state: Exporting
      - condition: template
        value_template: >-
          {{ (state_attr('predbat.status', 'detail') | default('', true)
               | regex_findall('([0-9]+(?:\\.[0-9]+)?)%') | count) > 0 }}
    actions:
      - action: script.turn_on
        target:
          entity_id: script.predbat_alphaess_export_stop_soc
        data:
          variables:
            target_soc: >-
              {{ states('number.alphaess_inverter_force_discharging_stop_at_soc')
                 | float(0) }}
    mode: restart
